# Host tests on a CPU runner: the frontend, cache, manifest validation, runtime
# contracts, cost model and benchmark harness. Tests that need the compiled
# ragged-compile, the CUDA comparison library or a GPU skip here; they run on
# the RTX 4090 described in README.md.
name: host tests
on:
  push:
  pull_request:
jobs:
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU PyTorch and the test dependencies
        run: |
          python -m pip install numpy==2.3.5 pytest==9.1.1 matplotlib==3.11.2
          python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Run the host tests
        run: python -m pytest -q
